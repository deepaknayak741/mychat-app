<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat2026 - Secure Admin</title>
    <script src="https://jsdelivr.net"></script>
    <style>
        body { font-family: Arial, sans-serif; padding: 15px; background: #111b21; color: white; margin: 0; }
        .login-box { max-width: 350px; margin: 60px auto; background: #202c33; padding: 25px; border-radius: 12px; text-align: center; box-shadow: 0 4px 10px rgba(0,0,0,0.4); }
        .login-box input { width: 100%; padding: 12px; margin: 10px 0; border-radius: 6px; border: 1px solid #374248; background: #2a3942; color: white; box-sizing: border-box; font-size: 15px; }
        .btn-green { width: 100%; padding: 12px; background: #00a884; color: white; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .btn-red { background: #dc3545; color: white; border: none; padding: 8px 12px; border-radius: 6px; cursor: pointer; float: right; font-weight: bold; }
        .refresh-btn { background: #28a745; color: white; border: none; padding: 10px 15px; border-radius: 6px; font-size: 15px; margin-bottom: 15px; cursor: pointer; font-weight: bold; }
        .code-list { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 20px; }
        .code-btn { padding: 10px 16px; background: #007bff; color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 15px; font-weight: bold; }
        .chat-box { background: #202c33; padding: 15px; border-radius: 10px; height: 400px; overflow-y: auto; border: 1px solid #374248; }
        .msg { padding: 10px; margin-bottom: 10px; border-radius: 8px; background: #2a3942; }
        .sender { font-weight: bold; color: #00a884; font-size: 13px; margin-bottom: 4px; }
    </style>
</head>
<body>

    <div id="login-screen" class="login-box">
        <h3>🔒 Secure Admin Login</h3>
        <input type="email" id="admin-email" placeholder="अपना Admin Email डालें">
        <input type="password" id="admin-pass" placeholder="अपना Password डालें">
        <button class="btn-green" onclick="adminLogin()">लॉग-इन करें</button>
        <p id="login-error" style="color: #ff6b6b; font-size: 14px; margin-top: 10px;"></p>
    </div>

    <div id="admin-content" style="display:none;">
        <button class="btn-red" onclick="adminLogout()">लॉग-आउट</button>
        <h2>👑 Chat2026 - Admin Panel</h2>
        <button class="refresh-btn" onclick="loadAllCodes()">🔄 सभी कोड रिफ्रेश करें</button>
        <div id="codesContainer" class="code-list">कोड लोड हो रहे हैं...</div>
        <h3 id="currentRoomTitle" style="font-size: 16px; color: #aebac1;">ऊपर किसी कोड पर दबाकर चैट देखें</h3>
        <div id="chatBox" class="chat-box"></div>
    </div>

    <script>
        const SUPABASE_URL = 'https://supabase.co';
        const SUPABASE_KEY = 'sb_publishable_WiIbyY-HdqA7Hj_-Dx9utQ_8rFrjx2m';
        const TABLE_NAME = 'messages'; 

        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        window.onload = async () => {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (session) {
                showDashboard();
            }
        };

        async function adminLogin() {
            const email = document.getElementById('admin-email').value.trim();
            const password = document.getElementById('admin-pass').value.trim();
            const errorText = document.getElementById('login-error');
            errorText.innerText = 'जाँच हो रही है...';

            const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });

            if (error) {
                errorText.innerText = 'गलत ईमेल या पासवर्ड!';
            } else {
                errorText.innerText = '';
                showDashboard();
            }
        }

        async function adminLogout() {
            await supabaseClient.auth.signOut();
            location.reload();
        }

        function showDashboard() {
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('admin-content').style.display = 'block';
            loadAllCodes();
        }

        async function loadAllCodes() {
            const container = document.getElementById('codesContainer');
            container.innerHTML = 'कोड ढूंढे जा रहे हैं...';

            const { data, error } = await supabaseClient
                .from(TABLE_NAME)
                .select('room_code');

            if (error) {
                container.innerHTML = 'एरर: ' + error.message;
                return;
            }

            const uniqueCodes = [...new Set(data.map(item => item.room_code))].filter(Boolean);
            container.innerHTML = '';

            if (uniqueCodes.length === 0) {
                container.innerHTML = 'अभी किसी भी कोड से कोई चैट नहीं हुई है।';
                return;
            }

            uniqueCodes.forEach(code => {
                const btn = document.createElement('button');
                btn.className = 'code-btn';
                btn.innerText = 'कोड: ' + code;
                btn.onclick = () => loadChatForCode(code);
                container.appendChild(btn);
            });
        }

        async function loadChatForCode(code) {
            document.getElementById('currentRoomTitle').innerText = 'चैट देख रहे हैं - कोड: ' + code;
            const chatBox = document.getElementById('chatBox');
            chatBox.innerHTML = 'मैसेज लोड हो रहे हैं...';

            const { data, error } = await supabaseClient
                .from(TABLE_NAME)
                .select('*')
                .eq('room_code', code)
                .order('created_at', { ascending: true });

            if (error) {
                chatBox.innerHTML = 'एरर: ' + error.message;
                return;
            }

            chatBox.innerHTML = '';
            data.forEach(msg => {
                const div = document.createElement('div');
                div.className = 'msg';
                div.innerHTML = `<div class="sender">${msg.sender || 'User'}</div><div>${msg.message}</div>`;
                chatBox.appendChild(div);
            });
        }
    </script>
</body>
    </html>
