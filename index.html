<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Room2026 - Live Chat</title>
    <script src="https://jsdelivr.net"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #ece5dd; display: flex; flex-direction: column; height: 100vh; }
        
        /* Header */
        .header { background-color: #075e54; color: white; padding: 15px; text-align: center; box-shadow: 0 2px 5px rgba(0,0,0,0.2); }
        .header h1 { font-size: 20px; }
        .header p { font-size: 12px; opacity: 0.8; }

        /* Login / Room Join Screen */
        #join-screen { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 20px; background: white; }
        .card { width: 100%; max-width: 350px; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); text-align: center; }
        .card h2 { color: #075e54; margin-bottom: 15px; }
        .card input { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ccc; border-radius: 8px; font-size: 16px; }
        .card button { width: 100%; padding: 12px; background-color: #25d366; color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .card button:hover { background-color: #128c7e; }

        /* Chat Screen */
        #chat-screen { display: none; flex-direction: column; flex: 1; overflow: hidden; }
        .room-bar { background: #128c7e; color: white; padding: 8px 15px; display: flex; justify-content: space-between; align-items: center; font-size: 14px; }
        .leave-btn { background: #ff4d4d; color: white; border: none; padding: 5px 10px; border-radius: 5px; cursor: pointer; font-size: 12px; }
        
        #messages { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .msg { max-width: 75%; padding: 10px 14px; border-radius: 10px; font-size: 15px; line-height: 1.4; word-wrap: break-word; box-shadow: 0 1px 2px rgba(0,0,0,0.1); }
        .msg.other { background-color: white; align-self: flex-start; border-top-left-radius: 0; }
        .msg.me { background-color: #dcf8c6; align-self: flex-end; border-top-right-radius: 0; }
        .sender-name { font-size: 11px; font-weight: bold; color: #075e54; margin-bottom: 3px; display: block; }

        /* Input Area */
        .input-area { display: flex; padding: 10px; background: #f0f0f0; gap: 8px; }
        .input-area input { flex: 1; padding: 12px; border: none; border-radius: 25px; outline: none; font-size: 15px; }
        .input-area button { background: #075e54; color: white; border: none; padding: 0 20px; border-radius: 25px; font-weight: bold; cursor: pointer; }

        /* Ad Banner Space (Pese kamane ke liye) */
        .ad-space { background: #fff3cd; color: #856404; text-align: center; padding: 8px; font-size: 12px; border-top: 1px solid #ffeeba; }
    </style>
</head>
<body>

    <div class="header">
        <h1>Room2026 Chat</h1>
        <p>Global Private Chat Rooms</p>
    </div>

    <!-- Room Join Screen -->
    <div id="join-screen">
        <div class="card">
            <h2>चैट रूम में जुड़ें</h2>
            <input type="text" id="username" placeholder="अपना नाम लिखें (जैसे: Deepak)" required>
            <input type="text" id="room-code" placeholder="रूम नंबर डालें (जैसे: 101)" value="101" required>
            <button onclick="joinRoom()">चैट शुरू करें 🚀</button>
        </div>
    </div>

    <!-- Live Chat Screen -->
    <div id="chat-screen">
        <div class="room-bar">
            <span id="room-title">Room: 101</span>
            <button class="leave-btn" onclick="leaveRoom()">बाहर निकलें</button>
        </div>
        <div id="messages"></div>
        <div class="input-area">
            <input type="text" id="msg-input" placeholder="मैसेज लिखें..." onkeypress="if(event.key === 'Enter') sendMessage()">
            <button onclick="sendMessage()">भेजें</button>
        </div>
    </div>

    <!-- Yahan future me Google AdSense ya Adsterra ka code lagega -->
    <div class="ad-space">
        📢 Advertisement Space (यहाँ आपके विज्ञापन दिखेंगे)
    </div>

    <script>
        // Aapka Supabase Connection
        const SUPABASE_URL = 'https://supabase.co';
        const SUPABASE_KEY = 'sb_publishable_WiIbyY-HdqA7Hj_-Dx9utQ_8rFrjx2m';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let currentUser = '';
        let currentRoom = '';
        let chatSubscription = null;

        function joinRoom() {
            const nameInput = document.getElementById('username').value.trim();
            const roomInput = document.getElementById('room-code').value.trim();

            if (!nameInput || !roomInput) {
                alert('कृपया अपना नाम और रूम नंबर दोनों लिखें!');
                return;
            }

            currentUser = nameInput;
            currentRoom = roomInput;

            document.getElementById('join-screen').style.display = 'none';
            document.getElementById('chat-screen').style.display = 'flex';
            document.getElementById('room-title').innerText = `Room: ${currentRoom} (${currentUser})`;

            loadMessages();
            subscribeToMessages();
        }

        function leaveRoom() {
            if (chatSubscription) supabaseClient.removeChannel(chatSubscription);
            document.getElementById('chat-screen').style.display = 'none';
            document.getElementById('join-screen').style.display = 'flex';
            document.getElementById('messages').innerHTML = '';
        }

        async function loadMessages() {
            const { data, error } = await supabaseClient
                .from('messages')
                .select('*')
                .eq('room_code', currentRoom)
                .order('id', { ascending: true });

            if (error) {
                console.error('Error loading messages:', error);
                alert('मैसेज लोड करने में दिक्कत आई। Supabase table चेक करें।');
                return;
            }

            const msgBox = document.getElementById('messages');
            msgBox.innerHTML = '';
            data.forEach(msg => displayMessage(msg));
        }

        function subscribeToMessages() {
            chatSubscription = supabaseClient
                .channel('public:messages')
                .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages' }, payload => {
                    if (payload.new.room_code === currentRoom) {
                        displayMessage(payload.new);
                    }
                })
                .subscribe();
        }

        function displayMessage(msg) {
            const msgBox = document.getElementById('messages');
            const div = document.createElement('div');
            const isMe = msg.sender === currentUser;
            
            div.className = `msg ${isMe ? 'me' : 'other'}`;
            div.innerHTML = `<span class="sender-name">${msg.sender}</span>${msg.message}`;
            
            msgBox.appendChild(div);
            msgBox.scrollTop = msgBox.scrollHeight;
        }

        async function sendMessage() {
            const input = document.getElementById('msg-input');
            const text = input.value.trim();
            if (!text) return;

            input.value = '';

            const { error } = await supabaseClient
                .from('messages')
                .insert([{ room_code: currentRoom, sender: currentUser, message: text }]);

            if (error) {
                console.error('Error sending message:', error);
                alert('मैसेज नहीं जा सका! कृपया इंटरनेट या डेटाबेस चेक करें।');
            }
        }
    </script>
</body>
          </html>
