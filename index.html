<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MyChat Live App & Admin Panel</title>
<style>
  * { box-sizing: border-box; font-family: Arial, sans-serif; }
  body { background-color: #e5ddd5; margin: 0; padding: 0; display: flex; justify-content: center; height: 100vh; }
  .app-box { width: 100%; max-width: 500px; background: #efeae2; display: flex; flex-direction: column; height: 100%; box-shadow: 0 0 10px rgba(0,0,0,0.2); }
  .header { background: #075e54; color: white; padding: 15px; text-align: center; font-size: 18px; font-weight: bold; }
  .tabs { display: flex; background: #128c7e; }
  .tab-btn { flex: 1; padding: 12px; border: none; background: transparent; color: white; font-size: 15px; cursor: pointer; font-weight: bold; }
  .tab-btn.active { background: #075e54; color: white; border-bottom: 3px solid #25d366; }
  .controls { padding: 12px; background: #f0f2f5; border-bottom: 1px solid #ccc; display: flex; flex-direction: column; gap: 8px; }
  .row { display: flex; gap: 8px; }
  input { flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 5px; font-size: 14px; }
  button.action-btn { padding: 10px 16px; background: #25d366; color: white; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; }
  .chat-area { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: 78%; padding: 9px 13px; border-radius: 10px; font-size: 15px; line-height: 1.4; word-wrap: break-word; }
  .msg-other { background: white; align-self: flex-start; border-bottom-left-radius: 0; box-shadow: 0 1px 1px rgba(0,0,0,0.1); }
  .msg-me { background: #dcf8c6; align-self: flex-end; border-bottom-right-radius: 0; box-shadow: 0 1px 1px rgba(0,0,0,0.1); }
  .msg-admin { background: #fff3cd; align-self: center; border: 1px solid #ffeeba; text-align: center; max-width: 90%; }
  .sender-name { font-size: 11px; font-weight: bold; color: #075e54; margin-bottom: 3px; }
  .send-box { display: flex; padding: 10px; background: #f0f2f5; gap: 8px; }
  .send-box input { border-radius: 20px; padding: 10px 15px; }
  .send-box button { background: #075e54; color: white; border: none; padding: 0 20px; border-radius: 20px; font-weight: bold; cursor: pointer; }
</style>
</head>
<body>

<div class="app-box">
  <div class="header">MyChat Live System</div>
  
  <div class="tabs">
    <button class="tab-btn active" id="tabUser" onclick="switchMode('user')">User Chat (बात करें)</button>
    <button class="tab-btn" id="tabAdmin" onclick="switchMode('admin')">Admin Panel (चैट देखें)</button>
  </div>

  <div class="controls" id="userControls">
    <div class="row">
      <input type="text" id="userNameInput" placeholder="अपना नाम लिखें (जैसे: राहुल)">
      <input type="text" id="userRoomInput" placeholder="Room ID (जैसे: 101)">
    </div>
    <button class="action-btn" onclick="connectChat()">चैट शुरू करें</button>
  </div>

  <div class="controls" id="adminControls" style="display:none;">
    <div class="row">
      <input type="text" id="adminRoomInput" placeholder="किस Room ID की चैट देखनी है?">
      <button class="action-btn" onclick="connectChat()">चैट लोड करें</button>
    </div>
  </div>

  <div class="chat-area" id="chatBox">
    <p style="text-align:center; color:#666; margin-top:40px;">ऊपर Room ID डालें और बटन दबाएं।</p>
  </div>

  <div class="send-box">
    <input type="text" id="msgInput" placeholder="मैसेज लिखें...">
    <button onclick="sendMessage()">भेजें</button>
  </div>
</div>

<script>
  let currentMode = 'user';
  let currentRoom = '';
  let myName = '';
  let refreshTimer = null;

  function switchMode(mode) {
    currentMode = mode;
    document.getElementById('tabUser').classList.toggle('active', mode === 'user');
    document.getElementById('tabAdmin').classList.toggle('active', mode === 'admin');
    document.getElementById('userControls').style.display = mode === 'user' ? 'flex' : 'none';
    document.getElementById('adminControls').style.display = mode === 'admin' ? 'flex' : 'none';
    document.getElementById('chatBox').innerHTML = '<p style="text-align:center; color:#666; margin-top:40px;">ऊपर Room ID डालें और बटन दबाएं।</p>';
    currentRoom = '';
    if (refreshTimer) clearInterval(refreshTimer);
  }

  function connectChat() {
    if (currentMode === 'user') {
      myName = document.getElementById('userNameInput').value.trim();
      currentRoom = document.getElementById('userRoomInput').value.trim();
      if (!myName || !currentRoom) { alert("कृपया अपना नाम और Room ID दोनों भरें!"); return; }
    } else {
      myName = "Admin";
      currentRoom = document.getElementById('adminRoomInput').value.trim();
      if (!currentRoom) { alert("कृपया Room ID भरें!"); return; }
    }

    loadMessages();
    if (refreshTimer) clearInterval(refreshTimer);
    refreshTimer = setInterval(loadMessages, 1000);
  }

  function loadMessages() {
    if (!currentRoom) return;
    const chatBox = document.getElementById('chatBox');
    const allData = JSON.parse(localStorage.getItem('mychat_messages') || '[]');
    const roomMsgs = allData.filter(m => m.room === currentRoom);

    chatBox.innerHTML = '';
    if (roomMsgs.length === 0) {
      chatBox.innerHTML = '<p style="text-align:center; color:#075e54; margin-top:20px;">रूम ' + currentRoom + ' चालू है। पहला मैसेज भेजें!</p>';
      return;
    }

    roomMsgs.forEach(function(data) {
      const div = document.createElement('div');
      if (data.sender === "Admin") {
        div.className = 'msg msg-admin';
        div.innerHTML = '<div class="sender-name">Admin</div>' + data.text;
      } else if (data.sender === myName) {
        div.className = 'msg msg-me';
        div.innerHTML = '<div class="sender-name">आप (' + data.sender + ')</div>' + data.text;
      } else {
        div.className = 'msg msg-other';
        div.innerHTML = '<div class="sender-name">' + data.sender + '</div>' + data.text;
      }
      chatBox.appendChild(div);
    });
    chatBox.scrollTop = chatBox.scrollHeight;
  }

  function sendMessage() {
    const msgInput = document.getElementById('msgInput');
    const text = msgInput.value.trim();
    if (!currentRoom) {
      alert("पहले ऊपर Room ID डालकर 'चैट शुरू करें' दबाएं!");
      return;
    }
    if (!text) return;

    const allData = JSON.parse(localStorage.getItem('mychat_messages') || '[]');
    allData.push({
      room: currentRoom,
      sender: myName,
      text: text,
      time: Date.now()
    });
    localStorage.setItem('mychat_messages', JSON.stringify(allData));
    msgInput.value = '';
    loadMessages();
  }
</script>

</body>
</html>
