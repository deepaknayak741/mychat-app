<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Room2026 Chat</title>
  <script src="https://jsdelivr.net"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
    body { background: #111b21; color: #fff; display: flex; justify-content: center; align-items: center; height: 100vh; }
    .box { background: #202c33; width: 100%; max-width: 420px; height: 100vh; max-height: 750px; display: flex; flex-direction: column; border-radius: 10px; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
    
    #login-screen { padding: 30px 20px; display: flex; flex-direction: column; justify-content: center; height: 100%; text-align: center; }
    #login-screen h1 { color: #00a884; margin-bottom: 10px; font-size: 28px; }
    #login-screen p { color: #8696a0; margin-bottom: 25px; font-size: 14px; }
    input { width: 100%; padding: 14px; margin-bottom: 15px; border-radius: 8px; border: none; background: #2a3942; color: #fff; font-size: 16px; outline: none; }
    button { width: 100%; padding: 14px; border-radius: 8px; border: none; background: #00a884; color: #111b21; font-size: 16px; font-weight: bold; cursor: pointer; }
    button:active { background: #008f6f; }

    #chat-screen { display: none; flex-direction: column; height: 100%; }
    .header { background: #202c33; padding: 15px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #2a3942; }
    .header h3 { font-size: 18px; color: #e9edef; }
    .exit-btn { width: auto; padding: 6px 12px; background: #ef4444; color: white; font-size: 13px; }
    
    #messages-box { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; background: #0b141a; }
    .msg { max-width: 80%; padding: 10px 14px; border-radius: 8px; font-size: 15px; word-wrap: break-word; }
    .msg.other { background: #202c33; align-self: flex-start; }
    .msg.mine { background: #005c4b; align-self: flex-end; }
    .msg-user { font-size: 11px; color: #00a884; font-weight: bold; margin-bottom: 4px; }
    .msg.mine .msg-user { color: #8696a0; }

    .input-area { background: #202c33; padding: 10px; display: flex; gap: 8px; }
    .input-area input { margin-bottom: 0; flex: 1; padding: 12px; }
    .input-area button { width: auto; padding: 0 20px; }
  </style>
</head>
<body>

<div class="box">
  <div id="login-screen">
    <h1>Room2026 🚀</h1>
    <p>अपना नाम और रूम नंबर डालकर चैट शुरू करें</p>
    <input type="text" id="username-input" placeholder="आपका नाम (जैसे: Deepak)">
    <input type="text" id="room-input" placeholder="रूम नंबर (जैसे: 102)">
    <button onclick="startChat()">चैट शुरू करें 🚀</button>
  </div>

  <div id="chat-screen">
    <div class="header">
      <div>
        <h3 id="room-title">Room #102</h3>
        <small id="user-badge" style="color:#00a884;"></small>
      </div>
      <button class="exit-btn" onclick="location.reload()">बाहर निकलें</button>
    </div>
    <div id="messages-box"></div>
    <div class="input-area">
      <input type="text" id="msg-input" placeholder="मैसेज लिखें..." onkeypress="if(event.key==='Enter') sendMessage()">
      <button onclick="sendMessage()">भेजें</button>
    </div>
  </div>
</div>

<script>
  const SUPABASE_URL = 'https://supabase.co';
  const SUPABASE_KEY = 'sb_publishable_WiIbyY-HdqA7Hj_-Dx9utQ_8rFrjx2m';
  const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  let currentUser = '';
  let currentRoom = '';

  function startChat() {
    const rawName = document.getElementById('username-input').value.trim();
    const room = document.getElementById('room-input').value.trim();

    if (!rawName || !room) {
      alert('कृपया अपना नाम और रूम नंबर दोनों भरें!');
      return;
    }

    currentUser = rawName;
    currentRoom = room;
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('chat-screen').style.display = 'flex';
    document.getElementById('room-title').innerText = 'Room #' + currentRoom;
    document.getElementById('user-badge').innerText = 'User: ' + currentUser;

    loadMessages();
    setInterval(loadMessages, 2500);
  }

  async function loadMessages() {
    const { data, error } = await supabaseClient
      .from('messages')
      .select('*')
      .eq('room_id', currentRoom)
      .order('created_at', { ascending: true });

    if (error) return;

    const box = document.getElementById('messages-box');
    const isAtBottom = box.scrollHeight - box.scrollTop <= box.clientHeight + 100;
    
    box.innerHTML = '';
    data.forEach(item => {
      const div = document.createElement('div');
      const isMine = item.username === currentUser;
      div.className = 'msg ' + (isMine ? 'mine' : 'other');
      
      div.innerHTML = `
        <div class="msg-user">${item.username}</div>
        <div>${item.message}</div>
      `;
      box.appendChild(div);
    });

    if (isAtBottom) {
      box.scrollTop = box.scrollHeight;
    }
  }

  async function sendMessage() {
    const input = document.getElementById('msg-input');
    const text = input.value.trim();
    if (!text) return;

    input.value = '';

    const { error } = await supabaseClient
      .from('messages')
      .insert([{ room_id: currentRoom, username: currentUser, message: text }]);

    if (error) {
      alert('मैसेज भेजने में दिक्कत आई: ' + error.message);
    } else {
      loadMessages();
    }
  }
</script>

</body>
          </html>
