<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat2026 - Live Chat</title>
  <style>
    body { font-family: sans-serif; background: #f0f2f5; margin: 0; padding: 15px; }
    .box { max-width: 450px; margin: auto; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    input, button { width: 100%; padding: 12px; margin: 8px 0; border-radius: 6px; border: 1px solid #ccc; box-sizing: border-box; font-size: 16px; }
    button { background: #008069; color: white; border: none; font-weight: bold; cursor: pointer; }
    #chat-box { height: 320px; overflow-y: auto; border: 1px solid #ddd; padding: 10px; background: #efeae2; border-radius: 6px; margin-bottom: 10px; }
    .msg { background: white; padding: 8px 12px; margin: 6px 0; border-radius: 8px; box-shadow: 0 1px 1px rgba(0,0,0,0.1); }
    .sender { font-weight: bold; font-size: 12px; color: #008069; }
    h2 { user-select: none; cursor: pointer; }
  </style>
</head>
<body>

<div class="box" id="login-screen">
  <h2 onclick="secretAdminTap()">💬 Live Chat में जुड़ें</h2>
  <input type="text" id="username" placeholder="अपना नाम लिखें">
  <input type="text" id="room" placeholder="रूम नंबर डालें">
  <button onclick="joinChat()">चैट शुरू करें</button>
</div>

<div class="box" id="chat-screen" style="display:none;">
  <h3 id="room-title">Room: </h3>
  <div id="chat-box"></div>
  <input type="text" id="msg-input" placeholder="मैसेज लिखें...">
  <button onclick="sendMessage()">भेजें (Send)</button>
</div>

<script>
  const URL = 'https://supabase.co';
  const KEY = 'sb_publishable_WiIbyY-HdqA7Hj_-Dx9utQ_8rFrjx2m';
  const HEADERS = { 'apikey': KEY, 'Authorization': 'Bearer ' + KEY, 'Content-Type': 'application/json' };

  let currentUser = '', currentRoom = '', lastCount = -1;

  let tapCount = 0, tapTimer = null;
  function secretAdminTap() {
    tapCount++;
    clearTimeout(tapTimer);
    if (tapCount >= 5) { tapCount = 0; window.location.href = 'admin.html'; }
    tapTimer = setTimeout(() => { tapCount = 0; }, 2000);
  }

  function joinChat() {
    currentUser = document.getElementById('username').value.trim();
    currentRoom = document.getElementById('room').value.trim();
    if (!currentUser || !currentRoom) { alert('कृपया नाम और रूम नंबर डालें!'); return; }

    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('chat-screen').style.display = 'block';
    document.getElementById('room-title').innerText = 'Room: ' + currentRoom;

    loadMessages();
    setInterval(loadMessages, 3000);
  }

  async function loadMessages() {
    try {
      const res = await fetch(`${URL}?room_code=eq.${encodeURIComponent(currentRoom)}&order=created_at.asc`, { headers: HEADERS });
      const data = await res.json();
      if (!res.ok) { alert('लोड एरर: ' + (data.message || JSON.stringify(data))); return; }
      if (Array.isArray(data) && data.length !== lastCount) {
        lastCount = data.length;
        const box = document.getElementById('chat-box');
        box.innerHTML = '';
        data.forEach(m => {
          box.innerHTML += `<div class="msg"><div class="sender">${m.sender}</div><div>${m.message}</div></div>`;
        });
        box.scrollTop = box.scrollHeight;
      }
    } catch (e) { alert('नेटवर्क एरर: ' + e.message); }
  }

  async function sendMessage() {
    const input = document.getElementById('msg-input');
    const text = input.value.trim();
    if (!text) return;
    input.value = '';

    try {
      const res = await fetch(URL, {
        method: 'POST',
        headers: HEADERS,
        body: JSON.stringify({ room_code: currentRoom, sender: currentUser, message: text })
      });
      if (!res.ok) {
        const errData = await res.json();
        alert('मैसेज नहीं गया: ' + (errData.message || JSON.stringify(errData)));
        return;
      }
      loadMessages();
    } catch (e) { alert('भेजने में एरर: ' + e.message); }
  }
</script>
</body>
</html>
